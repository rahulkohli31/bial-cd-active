[project]
name = "bial-backend"
version = "0.1.0"
description = "BIAL Citizen Developer Platform — FastAPI control-plane"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "azure-identity>=1.25.3",
    "azure-mgmt-appcontainers>=5.0.0",
    "azure-storage-blob>=12.30.0",
    "cryptography>=49.0.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "taskiq>=0.12.4",
]

[dependency-groups]
# PEP 735 groups (ADR-0002), four tiers following the sibling `badger` repo:
#   [project] dependencies = shared runtime, incl. `taskiq` — the task decorators and
#                            `src/broker.py` are importable by ANY role
#   api    = runtime web deps
#   worker = the CONCRETE broker, needed only where it connects
#   dev    = tooling + tests
# ADR-0011 flipped Deferred -> Accepted on 2026-08-11 when sandbox reclamation (ADR-0029)
# met its written flip condition; this comment used to say "no `worker` group this phase".
api = [
    "fastapi[standard]>=0.138.2",
    "mammoth>=1.12.0",
    "markdownify>=1.2.3",
    "openpyxl>=3.1.5",
    "pydantic-ai-slim[anthropic]>=2.5.0",
    "redis>=8.0.1",
]
dev = [
    "fakeredis[lua]>=2.36.2",
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]
worker = [
    # NOT pinned to `redis>=7,<8`, deliberately. An earlier plan draft called for that, to dodge
    # redis-py 8's 5s default socket_timeout killing blocking reads (taskiq-redis #127). It is
    # unimplementable — `uv lock` errors, because the `api` group already requires redis>=8.0.1 —
    # and it is unnecessary: #127 is scoped to `ListQueueBroker`, which `src/broker.py` rejects
    # for independent reasons. `RedisStreamBroker` is safe on redis-py 8 only because its
    # `xread_block` (ms) stays strictly BELOW `socket_timeout` (s x 1000); both are passed
    # explicitly in `src/broker.py` and the invariant is asserted in `tests/test_broker.py`, so
    # neither a library default nor a config edit can silently cross them.
    "taskiq-redis>=1.2.3,<2",
]

[tool.uv]
# `uv sync` / `uv run` install api + dev + worker so the app deps and the four gates
# (ruff, ty, mypy, pyright) are always present in the dev/CI environment. `worker` is included
# so the type checkers can resolve `src/broker.py`'s taskiq_redis import, and so a local run and
# the BUILT IMAGE cannot diverge — the image's sync line names the groups explicitly, and an
# image missing `--group worker` ships no broker and dies at container start, AFTER the
# human-gated Azure provisioning is already done.
default-groups = ["api", "dev", "worker"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

# Four gates, by design (ADR-0003): ty is the fast everyday/IDE checker; mypy
# --strict is the completeness gate (full annotations, no implicit Any / bare
# generics); pyright (pyrightconfig.json) is the code-quality gate that catches
# attribute-access issues through multi-inheritance and untyped library
# boundaries. Ruff formats + lints. All must pass before code ships.
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests are type-checked for real errors but not held to src-level annotation
# rigor (untyped fixtures, bare dict helpers, etc. are fine in tests).
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker / stubs. It's an indirect dep (the SQLAlchemy
# asyncpg driver); treat as untyped so a direct import in a migration/DB test
# doesn't fail the gate.
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# authlib ships no py.typed marker (KD-2). It's the OIDC client for the Entra
# Authorization-Code + PKCE flow; treat as untyped so the direct imports in
# services/auth/oidc.py don't fail mypy --strict. ty / pyright need no such
# accommodation, and joserfc (the session-JWT + JOSE stack) DOES ship py.typed.
module = ["authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The office-extraction stack (U11) ships no py.typed / stubs: mammoth (docx→html),
# markdownify (html→markdown), and openpyxl (xlsx). Treat as untyped so the direct
# imports in services/extract/office.py don't fail mypy --strict.
module = ["mammoth.*", "markdownify.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Keep the default lane free of EXTERNAL object-storage services: the Azurite
# storage round-trips are opt-in via `-m integration`. A live Postgres test
# database (backend/.env.test, name must contain "test") IS required for the
# default lane, matching the template. --strict-markers turns a typo'd marker
# into an error instead of silently running.
markers = [
    "integration: opt-in; needs external services (docker-compose Azurite for storage round-trips)",
    # The alembic column add/drop round-trips permanently burn a pg_attribute slot on the
    # shared citizen_one_test DB per run (a dropped column's attnum is never reused; ~1600
    # slots per table, ever). Deselected from the default lane so routine runs don't eat the
    # budget; run them explicitly before shipping a migration: `uv run pytest -m destructive_migration`.
    "destructive_migration: opt-in; alembic up/down round-trips that permanently consume pg_attribute slots on the shared test DB",
]
addopts = "-m 'not integration and not destructive_migration' --strict-markers"

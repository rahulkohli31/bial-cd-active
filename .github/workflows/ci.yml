name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # The backend previously had no CI job at all: every gate was run by hand, so a green check
  # on a PR said nothing about the backend. These steps are what make the gates mandatory and
  # enforced, not merely advisory.
  #
  # STATIC GATES ONLY, deliberately. They need no database, no Redis (tests fake it in
  # process) and no secrets, so this job is hermetic and cannot flake. `pytest` runs
  # separately, below, against a real database — keeping the two jobs apart means a database
  # outage or a flaky test never blocks the fast, hermetic checks from reporting.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: ty
        run: uv run ty check

      - name: mypy
        run: uv run mypy src tests

      - name: pyright
        run: uv run pyright src tests

      # Two competing `0028` revisions on separate branches produce two heads the moment both
      # merge, and `alembic upgrade head` then fails at DEPLOY time — the worst place to find
      # it. Nothing textually conflicts, so only this catches it. Reads the revision chain off
      # disk; the committed sample env is enough to construct settings, and no database is
      # contacted.
      - name: Single Alembic head
        run: |
          set -a; . ./.env.test.example; set +a
          heads=$(uv run alembic heads | grep -c '(head)')
          echo "alembic heads found: $heads"
          test "$heads" -eq 1

  # `pytest`, against a REAL Postgres, not the static gates above. Builds the exact substrate
  # `backend/.env.test.example` and `CONTRIBUTING.md`'s test-database runbook describe: a
  # `pgvector/pgvector:pg18` service (the suite asserts native `uuidv7()`, a PG18 feature, and
  # migration 0001 enables the `vector` extension), plus the dedicated `bial_appdb_maint` role
  # the per-project database tests provision through — never the control-plane role, never
  # `citizen_one_test` itself. `.env.test.example` is committed and copied as-is: its
  # `DATABASE_URL`/`APP_DB__MAINTENANCE_DSN` ports already match the service port below, so
  # nothing here rewrites it.
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bial
          POSTGRES_PASSWORD: bial
          POSTGRES_DB: citizen_one_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U bial -d citizen_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # The per-project database tests provision and drop REAL databases/roles through this
      # role (never the control-plane identity, never `citizen_one_test`) — see
      # `.env.test.example`'s own comment on `APP_DB__MAINTENANCE_DSN` for why. Created here,
      # once per run, against the fresh service container.
      - name: Create the app-database maintenance role
        run: |
          PGPASSWORD=bial psql -h localhost -p 5544 -U bial -d postgres -c \
            "CREATE ROLE bial_appdb_maint LOGIN CREATEDB CREATEROLE NOSUPERUSER PASSWORD 'bial_appdb_maint';"

      - name: Write .env.test
        run: cp .env.test.example .env.test

      - name: Run migrations
        run: ENV_FILE=.env.test uv run alembic upgrade head

      - name: pytest
        run: ENV_FILE=.env.test uv run pytest -q

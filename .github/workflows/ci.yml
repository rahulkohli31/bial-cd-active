name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

# A newer push to a pull request supersedes the run still in progress for it. Pushes to main and
# release branches always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portal-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # Vitest shards by test file, so each shard runs a third of the files on its own runner.
  portal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test -- --shard="$SHARD/3"

  # The backend's static gates: no database, no Redis (tests fake it in process) and no secrets.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: ty
        run: uv run ty check

      - name: mypy
        run: uv run mypy src tests

      - name: pyright
        run: uv run pyright src tests

      # Two competing `0028` revisions on separate branches produce two heads the moment both
      # merge, and `alembic upgrade head` then fails at DEPLOY time — the worst place to find
      # it. Nothing textually conflicts, so only this catches it. Reads the revision chain off
      # disk; the committed sample env is enough to construct settings, and no database is
      # contacted.
      - name: Single Alembic head
        run: |
          set -a; . ./.env.test.example; set +a
          heads=$(uv run alembic heads | grep -c '(head)')
          echo "alembic heads found: $heads"
          test "$heads" -eq 1

name: PR E2E Screenshots

# Manually screenshots a PR's key screens against a REAL backend + portal, without
# Docker Desktop or WSL on anyone's machine: ubuntu-latest already has Docker, and
# Postgres runs here as a `services:` container instead. Everything else the backend
# would normally want (Redis, object storage, sandbox, Foundry) stays unset, exactly
# like Tier A in docs/local-test-setup.md — this workflow is Tier A, run in CI.
#
# Adding a profile for a new PR: see the dispatch block at the bottom of
# portal/scripts/capture-pr-screenshots.mjs.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check out (its head commit is tested, not a merge)"
        required: true
        type: string
      profile:
        description: "What to capture"
        required: true
        type: choice
        options:
          - chat-ui
          - identity-assertion

jobs:
  screenshot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bial
          POSTGRES_PASSWORD: bial
          POSTGRES_DB: citizen_one_ci
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U bial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python (pinned by backend/.python-version)
        run: uv python install
        working-directory: backend

      - name: Install backend deps
        run: uv sync
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal deps
        run: npm ci
        working-directory: portal

      - name: Install Playwright's chromium
        run: npx playwright install --with-deps chromium
        working-directory: portal

      # feat/app-identity-entra and feat/home-chat-assistant-ui both branched before
      # this tooling existed, and it was later dropped from main by an unrelated
      # revert (see docs/local-test-setup.md) — recover it from the one commit
      # that still has it, on every checkout, rather than requiring it be merged
      # onto whatever PR branch is under test. No separate `git fetch` needed: the
      # checkout step above already used fetch-depth: 0 (full history, all branches
      # and tags), and 93e0666 is an ancestor of both PR branches this workflow
      # targets, so it's already a local object by the time this step runs.
      # (`git fetch origin <bare-sha>` was tried here first and failed — GitHub's
      # upload-pack for this repo doesn't resolve fetch-by-SHA, only named refs.)
      - name: Restore dev session-minting tooling
        working-directory: backend
        run: |
          if [ ! -f tests/tooling/mint_dev_session.py ]; then
            git checkout 93e0666 -- tests/tooling/
          fi

      - name: Write backend/.env (fresh dev-only secrets, generated per run)
        working-directory: backend
        run: |
          SESSION_SECRET=$(openssl rand -base64 48)
          APP_KEY=$(uv run python -c "
          from joserfc.jwk import RSAKey
          import base64
          k = RSAKey.generate_key(2048, auto_kid=True)
          print(base64.b64encode(k.as_pem(private=True)).decode())
          ")
          cat > .env <<EOF
          ENVIRONMENT=development
          DATABASE_URL=postgresql+asyncpg://bial:bial@localhost:5544/citizen_one_ci
          SUPERADMIN_EMAILS=ci-admin@bial.example
          FRONTEND_URL=http://localhost:5173
          BACKEND_URL=http://localhost:8000
          AUTH__TENANT_ID=00000000-0000-0000-0000-000000000000
          AUTH__CLIENT_ID=00000000-0000-0000-0000-000000000001
          AUTH__CLIENT_SECRET=dummy-not-used-in-ci
          AUTH__SESSION_SECRET=${SESSION_SECRET}
          AUTH__REDIRECT_URI=http://localhost:8000/v1/auth/callback
          APP_ASSERTION__PRIVATE_KEY_PEM_B64=${APP_KEY}
          EOF

      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Start backend
        working-directory: backend
        run: nohup uv run uvicorn src.main:app --port 8000 > /tmp/backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/v1/auth/jwks > /dev/null && exit 0
            sleep 2
          done
          echo "backend never became ready"; cat /tmp/backend.log; exit 1

      - name: Start portal dev server
        working-directory: portal
        run: nohup npm run dev > /tmp/portal.log 2>&1 &

      - name: Wait for portal
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 2
          done
          echo "portal never became ready"; cat /tmp/portal.log; exit 1

      - name: Mint dev session (bypasses Entra — see mint_dev_session.py docstring)
        working-directory: backend
        run: |
          mkdir -p ../portal/playwright/.auth
          uv run python -m tests.tooling.mint_dev_session \
            --email ci-e2e@bial.example --out ../portal/playwright/.auth/ci-session.json

      - name: Capture screenshots
        working-directory: portal
        env:
          SCREENSHOT_PROFILE: ${{ inputs.profile }}
          SESSION_FILE: playwright/.auth/ci-session.json
        run: node scripts/capture-pr-screenshots.mjs

      # PNGs only — never trace/video. playwright.config.ts already warns those
      # capture localStorage JWTs and response bodies; this workflow does not
      # produce them in the first place rather than relying on scrubbing them later.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ inputs.pr_number }}-${{ inputs.profile }}-screenshots
          path: portal/pr-screenshots/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ inputs.pr_number }}-${{ inputs.profile }}-logs
          path: |
            /tmp/backend.log
            /tmp/portal.log

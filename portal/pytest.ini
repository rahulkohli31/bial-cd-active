# Portal-scoped pytest config (plan U2 — the Docker-backed apps-router harness).
#
# This file exists ONLY to give the router test harness its OWN pytest rootdir = `portal/`,
# exactly as `sandbox/pytest.ini` does for the sandbox harness. The suite is run under the
# backend interpreter + deps:
#
#     cd portal && uv run --project ../backend pytest                     # offline lane
#     cd portal && uv run --project ../backend pytest -m integration      # Docker lane
#
# `uv run --project ../backend` supplies the interpreter and pytest; pytest INDEPENDENTLY
# discovers THIS file as its config, so backend's own `pyproject.toml` (rooted at `backend/`,
# whose `tests/conftest.py` HARD-REQUIRES a live Postgres) is never the rootdir and never
# collected. No `backend/` file is edited.
#
# WHY `pytest.ini` AND NOT `pyproject.toml`. A `pyproject.toml` carrying no `[project]` table is
# read by uv as an implicit VIRTUAL WORKSPACE ROOT (astral-sh/uv#4541), so any bare `uv` call in
# portal/ — one that forgets `--project ../backend` — dropped a `.venv` and an empty `uv.lock`
# into this Node package. `pytest.ini` is invisible to uv's project discovery, and pytest ranks
# it ABOVE `pyproject.toml`: it always matches, even when empty. `portal/` is a Node package,
# not an installable Python one, and now nothing in the tree claims otherwise.

[pytest]
testpaths = tests
# --strict-markers turns a typo'd marker into an error rather than a silent skip.
markers =
    integration: opt-in; needs Docker (real nginx + a stub app container)
# The default lane runs nothing here; the Docker lane is opt-in via `-m integration`, mirroring
# sandbox/ so `pytest` without Docker gives a clean skip rather than a multi-minute image build.
addopts = -m 'not integration' --strict-markers

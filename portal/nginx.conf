# Frontend edge: serve the built SPA and proxy the API surface to the FastAPI backend.
# Mirrors the Vite dev proxy (portal/vite.config.js): /api/v1/auth strips /api; other
# /api/* rewrites /api->/v1; /apps passes through. ${PORT} and ${BACKEND_URL}
# are substituted from the environment at container start (nginx envsubst on templates);
# nginx's own $host/$uri variables have no braces and are left untouched.

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: 35 MB chat bodies (inlined attachments) + 4 MB file uploads must pass;
    # nginx's 1 MiB default would 413 them before they reach FastAPI.
    client_max_body_size 40m;

    # Baseline security headers. A location-level add_header REPLACES all inherited
    # add_headers, so the /assets/ and =/index.html blocks below re-declare these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The portal's FIRST document CSP (Track PORTAL-PREVIEW, C8 §2, KTD-3). frame-src permits the
    # per-session sandbox preview origins (the ACA apps-domain wildcard) so the cockpit may frame
    # the live app; frame-ancestors 'self' keeps the portal itself un-frameable. DELIBERATELY only
    # framing is constrained — NO default-src/script-src/connect-src — so current SPA loads cannot
    # break. Declared in the SERVER block so `location /` (and the SPA fallback) INHERIT it; it is
    # re-declared in the two child blocks below that override headers (a location add_header
    # replaces ALL inherited ones). ${APPS_DOMAIN} is substituted at container start — a REQUIRED
    # input (the 19-require-apps-domain.sh entrypoint guard refuses to boot if it is unset/empty,
    # so envsubst never emits a malformed `https://*.`).
    add_header Content-Security-Policy "frame-src 'self' https://*.${APPS_DOMAIN}; frame-ancestors 'self'" always;

    # Common proxy headers (inherited by every proxied location below).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Entra auth: strip /api so /api/v1/auth/* -> backend /v1/auth/* (keeps the
    # refresh-cookie Path + OIDC redirect_uri byte-identical to dev). More specific
    # than /api/ below, so nginx's longest-prefix match routes auth here.
    location /api/v1/auth/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass ${BACKEND_URL};
    }

    # Business API: the SPA calls /api/<domain>; the backend serves /v1/<domain>.
    # The C3 build-session control API (/api/build-sessions/*) AND its GET-SSE progress feed
    # (/api/build-sessions/{id}/events) ride THIS block unchanged — no new proxy route is needed
    # (C3 §4): the rewrite maps them to /v1/build-sessions/*, and `proxy_buffering off` +
    # `proxy_read_timeout 600s` already stream the SSE feed and tolerate a long build (U7).
    location /api/ {
        rewrite ^/api(/.*)$ /v1$1 break;
        proxy_pass ${BACKEND_URL};
        # SSE (chat / app generation / build-session feed): stream deltas, don't buffer, allow long turns.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Runner shell + sandboxed frame (served by the backend; no rewrite).
    location /apps/ {
        proxy_pass ${BACKEND_URL};
    }

    # Hashed, immutable SPA bundles. Re-declares the baseline headers (a location add_header
    # replaces ALL inherited ones), so it must ALSO re-declare the CSP — otherwise these
    # static files would lose the inherited frame-src/frame-ancestors policy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-src 'self' https://*.${APPS_DOMAIN}; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # index.html is never cached, so a new deploy's asset hashes are always picked up. Same
    # re-declaration duty as /assets/ above (it overrides headers, so it must restate the CSP).
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-src 'self' https://*.${APPS_DOMAIN}; frame-ancestors 'self'" always;
    }

    # SPA history fallback: anything else resolves to a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

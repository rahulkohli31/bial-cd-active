# Frontend edge. TWO SITES on one listen port, told apart by Host:
#   1. the portal  — the built SPA + the API proxy to FastAPI (server_name _)
#   2. the apps    — generated apps at /a/<key>/, reverse-proxied to their own containers
#                    (server_name ${APPS_HOSTNAME})
#
# Portal proxying mirrors the Vite dev proxy (portal/vite.config.js): /api/v1/auth strips
# /api; other /api/* rewrites /api->/v1; /apps passes through. ${PORT}, ${BACKEND_URL},
# ${APPS_DOMAIN}, ${APPS_HOSTNAME}, ${PORTAL_ORIGIN} and ${DNS_RESOLVER} are substituted from
# the environment at container start (nginx envsubst on templates); nginx's own $host/$uri
# variables have no braces and are left untouched, as are the runtime $backend_upstream,
# $app_key and $app_host variables defined below.
#
# WHY ONE CONTAINER SERVES BOTH. The apps need a public hostname BIAL's certificate already
# covers, and the gateway already has a backend pool pointing here. A separate router
# deployable would need its own image, its own gateway backend pool and its own health probe
# — three more asks of an infrastructure team that is the long pole on this project. nginx
# already performs this exact hop for the backend (request-time DNS + SNI to a VNet-private
# Azure upstream), so the apps site is the same hop with a different upstream.
#
# WHY A SHARED HOSTNAME WITH THE KEY IN THE PATH, rather than one hostname per app. BIAL
# refused a wildcard certificate for `*.citizenapps.bialairport.com`, and a single-label
# certificate cannot cover per-app subdomains. Every app therefore shares one browser origin.
# That is a known, accepted cost recorded in the plan, not an oversight.

# ---------------------------------------------------------------------------------------
# http-context maps. These MUST sit outside every server block: conf.d/*.conf is included
# inside `http`, which is the only context `map` is valid in. They are evaluated lazily, so
# a map whose value names $app_key reads whatever the matched location set.
# ---------------------------------------------------------------------------------------

# WebSocket upgrade passthrough. `Connection` is a hop-by-hop header: forwarding the client's
# verbatim would send `close` on a keep-alive connection and kill the tunnel, so it is derived
# instead. Without this pair the live-reload socket is answered as an ordinary request and the
# preview silently stops updating between edits — a clean compile reported over a stale page.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The apps site's access log. `log_format` is an http-context directive — declaring it inside
# the server block below is an `[emerg] "log_format" directive is not allowed here` at load,
# so it lives up here with the maps while the `access_log` that selects it stays on the site.
#
# WHY A CUSTOM FORMAT. The distinction between "no such app" and "the app died" is deliberately
# NOT in the response — both are a flat 404, so nothing names the upstream to a browser — which
# means it has to survive somewhere an operator can read it. This is that place.
# `$upstream_status` is EMPTY when nothing ever answered (an unknown key's DNS miss, or a
# connect failure) and carries the real status when a live container answered with an error.
# The error log alongside it separates the first two: "could not be resolved" is an unknown key,
# "connect() failed" is a container that exists but is not listening. DEPLOYMENT-FACTS.md's
# troubleshooting table keys on exactly these strings.
log_format apps_router '$remote_addr "$request" host=$host status=$status '
                       'upstream_status=$upstream_status upstream=$upstream_addr '
                       'key=$app_key referer="$http_referer"';

# --- keyless resolution (U3 teaches `location /` to use these) --------------------------
# `basePath` rewrites what the FRAMEWORK generates. It does not touch a root-relative string
# the model typed by hand (`fetch("/api/items")`, `<img src="/logo.png">`, CSS `url(/hero.png)`)
# and it cannot touch what the browser asks for on its own (`/favicon.ico`). Those arrive with
# no key in the path and still have to reach the app that produced them.
#
# REFERER FIRST, COOKIE ONLY AS A LAST RESORT. A cookie on this host is last-write-wins across
# every app, so with two apps open in two tabs one app's form post would land in the other
# app's database — and since each app owns its own database, that is a write to someone else's
# data, not a broken image. `Referer` resolves each request against the page that produced it,
# so two tabs stay correct. Same-origin requests carry the full referring URL under the default
# referrer policy, which is what makes this the primary signal rather than the aspirational one.
#
# The referring URL is anchored to ${APPS_HOSTNAME} so a page on an unrelated host cannot name
# an app here. The optional port group is what lets the Docker-backed router test drive this
# on http://<host>:<port>; production traffic is https with no port.
map $http_referer $key_from_referer {
    default "";
    "~^https?://${APPS_HOSTNAME}(?::[0-9]+)?/a/((?:sbx|pub)-[0-9a-f]{28})(?:[/?#]|$)" $1;
}

# The fallback, for a top-level navigation that carries no `Referer` at all. Validated to the
# EXACT key shape before it can ever compose an upstream name: it is browser-supplied and it
# reaches a DNS lookup from this container's network position, so an unvalidated value is a
# request-forgery primitive, not merely a bad route.
map $cookie_bial_app $key_from_cookie {
    default "";
    "~^((?:sbx|pub)-[0-9a-f]{28})$" $1;
}

# Referer wins; the cookie answers only when there is no usable Referer at all.
map $key_from_referer $keyless_app_key {
    default $key_from_referer;
    ""      $key_from_cookie;
}

# The routing cookie, written ONLY on a top-level navigation.
#
# WITHOUT THE `Sec-Fetch-Mode: navigate` GATE this is a cross-site attack primitive: any page
# anywhere could force a write with a single `<img src="https://${APPS_HOSTNAME}/a/<their-key>/x">`,
# and every subsequent keyless call from the victim's own app would be silently redirected to
# the attacker's container, carrying whatever that app sends. Accidental mis-routing between a
# person's own tabs is accepted; a third party steering it is not.
#
# ATTRIBUTES ARE LOAD-BEARING. No `Domain`, so the cookie stays host-only to the apps hostname
# and is never sent to the portal. `Secure` + `HttpOnly` throughout. Plain `SameSite=Lax` works
# INSIDE THE PORTAL'S IFRAME only because the portal and the apps hostname share the registrable
# domain `bialairport.com`, which makes them same-site despite being different origins. If the
# portal ever moves to a different domain this fallback stops working in the frame, silently,
# and `SameSite=None; Secure` becomes required. Do not "tidy" this to `Strict`.
#
# An empty map value emits NO header at all (nginx skips a zero-length add_header value), which
# is what makes the non-navigate case a true no-op rather than a cookie with no attributes.
map $http_sec_fetch_mode $app_set_cookie {
    default "";
    "navigate" "bial_app=$app_key; Path=/; Secure; HttpOnly; SameSite=Lax";
}

# ---------------------------------------------------------------------------------------
# SITE 1 — THE PORTAL. THIS BLOCK MUST STAY FIRST ON THE LISTEN ADDRESS.
# nginx serves a request whose Host matches no server_name from the FIRST block declared on
# that address. Move the apps block above this one and every portal request with an unexpected
# Host is served by the apps site instead — the portal goes dark, and `nginx -t` stays green.
# ---------------------------------------------------------------------------------------

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: 35 MB chat bodies (inlined attachments) + 4 MB file uploads must pass;
    # nginx's 1 MiB default would 413 them before they reach FastAPI.
    client_max_body_size 40m;

    # Baseline security headers. A location-level add_header REPLACES all inherited
    # add_headers, so the /assets/ and =/index.html blocks below re-declare these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The portal's FIRST document CSP (Track PORTAL-PREVIEW, C8 §2, KTD-3). frame-src permits the
    # per-session sandbox preview origins (the ACA apps-domain wildcard) so the cockpit may frame
    # the live app; frame-ancestors 'self' keeps the portal itself un-frameable. DELIBERATELY only
    # framing is constrained — NO default-src/script-src/connect-src — so current SPA loads cannot
    # break. Declared in the SERVER block so `location /` (and the SPA fallback) INHERIT it; it is
    # re-declared in the two child blocks below that override headers (a location add_header
    # replaces ALL inherited ones). ${APPS_DOMAIN} is substituted at container start — a REQUIRED
    # input (the 19-require-apps-domain.sh entrypoint guard refuses to boot if it is unset/empty,
    # so envsubst never emits a malformed `https://*.`).
    add_header Content-Security-Policy "frame-src 'self' https://*.${APPS_DOMAIN}; frame-ancestors 'self'" always;

    # Common proxy headers (inherited by every proxied location below).
    proxy_http_version 1.1;
    # Host MUST be the upstream's own hostname ($proxy_host — nginx's default when no
    # override exists), NOT the browser's host: Azure App Service routes requests by Host,
    # so forwarding the portal's public host makes Azure's front door reject the hop with
    # its platform 403/404 pages before the backend ever runs. Dev uvicorn ignores Host,
    # which is exactly why this only ever broke on App Service (the environment-difference
    # class CLAUDE.local.md warns about). The browser-facing host still travels in
    # X-Forwarded-Host for any absolute-URL reconstruction.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Present SNI on upstream TLS (nginx defaults this OFF): App Service's HTTPS front
    # door needs it to select the right certificate. No-op for plain-http upstreams (dev).
    proxy_ssl_server_name on;

    # Re-resolve the backend hostname at request time (30s TTL) instead of pinning the
    # single answer nginx got at config load. A literal proxy_pass hostname is resolved
    # ONCE at container start — on App Service that froze a pre-private-endpoint public IP
    # for the container's whole lifetime and every /api call died on Azure's
    # "Web App - Unavailable" 403 block page. proxy_pass via a variable forces a runtime
    # lookup through this resolver. DNS_RESOLVER is a REQUIRED deploy input (fail-first;
    # the 19-require boot guard refuses to start without it): 168.63.129.16 on Azure
    # (resolves private-endpoint zones through the VNet), 127.0.0.11 under local Docker.
    # resolver_timeout bounds a resolver blip to 5s instead of nginx's 30s default —
    # failed lookups are not negative-cached, so every request during an outage would
    # otherwise hang the full 30s.
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream ${BACKEND_URL};

    # Entra auth: strip /api so /api/v1/auth/* -> backend /v1/auth/* (keeps the
    # refresh-cookie Path + OIDC redirect_uri byte-identical to dev). More specific
    # than /api/ below, so nginx's longest-prefix match routes auth here.
    location /api/v1/auth/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend_upstream;
    }

    # Business API: the SPA calls /api/<domain>; the backend serves /v1/<domain>.
    # The C3 build-session control API (/api/build-sessions/*) AND its GET-SSE progress feed
    # (/api/build-sessions/{id}/events) ride THIS block unchanged — no new proxy route is needed
    # (C3 §4): the rewrite maps them to /v1/build-sessions/*, and `proxy_buffering off` +
    # `proxy_read_timeout 600s` already stream the SSE feed and tolerate a long build (U7).
    location /api/ {
        rewrite ^/api(/.*)$ /v1$1 break;
        proxy_pass $backend_upstream;
        # SSE (chat / app generation / build-session feed): stream deltas, don't buffer, allow long turns.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Runner shell + sandboxed frame (served by the backend; no rewrite).
    location /apps/ {
        proxy_pass $backend_upstream;
    }

    # Hashed, immutable SPA bundles. Re-declares the baseline headers (a location add_header
    # replaces ALL inherited ones), so it must ALSO re-declare the CSP — otherwise these
    # static files would lose the inherited frame-src/frame-ancestors policy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-src 'self' https://*.${APPS_DOMAIN}; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # index.html is never cached, so a new deploy's asset hashes are always picked up. Same
    # re-declaration duty as /assets/ above (it overrides headers, so it must restate the CSP).
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-src 'self' https://*.${APPS_DOMAIN}; frame-ancestors 'self'" always;
    }

    # SPA history fallback: anything else resolves to a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------------------
# SITE 2 — THE APPS. Generated apps, addressed as https://${APPS_HOSTNAME}/a/<key>/…
#
# The key is `sbx-` or `pub-` plus 28 lowercase hex, which IS the container app's name, so the
# upstream is a string composition and this router holds no state and no registry. The cost of
# that is the failure mode: an unknown key is a DNS MISS, not a lookup miss, so it has to be
# turned into an explicit 404 here (see @app_gone) or it would surface as a 502 naming the
# upstream and disclosing the environment's naming convention.
#
# NOTHING HERE PROXIES TO THE BACKEND API. A generated app must not be able to reach the
# control plane on its own origin; the portal site above is the only place ${BACKEND_URL} is
# named, and that is deliberate rather than incidental.
#
# NO RESPONSE HEADERS ARE ADDED ON THIS SITE, and that is a decision rather than an omission.
# The app's own headers must reach the browser untouched — above all the sandbox Caddy's
# `Content-Security-Policy: frame-ancestors <portal-origin>`, which is the single authority on
# who may frame an app. Adding the portal's baseline `X-Frame-Options: SAMEORIGIN` here would
# break framing outright, since XFO cannot express an allowed cross-origin ancestor.
# ---------------------------------------------------------------------------------------
server {
    listen ${PORT};
    server_name ${APPS_HOSTNAME};

    # THE ENTIRE PROXY PREAMBLE IS RE-DECLARED HERE ON PURPOSE. nginx inherits directives
    # downward (http -> server -> location) and NEVER between sibling `server` blocks, and both
    # of the omissions that matter fail silently past `nginx -t`:
    #   - without `proxy_http_version 1.1` this block defaults to HTTP/1.0 and answers a
    #     WebSocket upgrade as an ordinary request, which is the live-reload death above;
    #   - without its own `resolver` the variable `proxy_pass` fails at request time and every
    #     app request is a 502 — the outcome the explicit 404 below exists to prevent.
    client_max_body_size 40m;
    proxy_http_version 1.1;
    # Host and SNI are the COMPOSED upstream name, not the browser's host: ACA routes by Host
    # and selects its certificate by SNI, so the container app's own FQDN must travel in both
    # or the environment's front door rejects the hop before the app ever runs. Set explicitly
    # from $app_host rather than left to nginx's $proxy_host default, so the value a test reads
    # is the value the config states.
    proxy_set_header Host $app_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $app_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Request-time DNS, for the same reason the portal block gives: a literal proxy_pass
    # hostname is resolved ONCE at container start, and these upstreams come and go constantly.
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;
    # Next streams its RSC payload, and the live-reload socket idles for minutes between two
    # model edits. Buffering would hold the stream; the 60s default read timeout would cut the
    # socket. NOTE: the Application Gateway sits IN FRONT of this and the shortest hop governs,
    # so this cannot compensate for the gateway's own request timeout — that is a named BIAL
    # prerequisite, not something nginx can fix from here.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # An upstream error is not shown to the browser as itself. nginx's own 502 body and its
    # default error page can name the composed upstream, which would hand anyone who can reach
    # the gateway the environment's naming convention.
    proxy_intercept_errors on;
    error_page 502 503 504 = @app_gone;

    # Declared at server level so every location has them defined even when it never matches a
    # key — an undefined variable in `proxy_set_header Host $app_host` is a config-load error.
    set $app_key "";
    set $app_host "";

    access_log /var/log/nginx/access.log apps_router;

    # THE SUPERVISOR IS NEVER REACHABLE FROM A BROWSER. It is bearer-guarded downstream, but
    # that guard was designed for a different threat and this is the layer where the invariant
    # is claimed, so it is enforced here too. `^~` outranks the regex locations below; the
    # second form catches the same surface behind a valid key, which the app's own Caddy would
    # fall through to `next dev` rather than serve, but which must not depend on that.
    location ^~ /_sup { return 404; }
    location ~ "^/a/(?:sbx|pub)-[0-9a-f]{28}/_sup(?:/|$)" { return 404; }

    # THE KEYED ARM. The prefix is real end to end: it arrives here, it is forwarded unchanged,
    # the app's in-container Caddy passes it through untouched, and the app itself is configured
    # to live at it. Stripping it here and letting the app think it is at the root was the
    # cheaper design and was rejected — the app would then generate root-relative links, the key
    # would vanish from the address bar on the first in-app navigation, and every shared or
    # bookmarked link would break.
    #
    # THE KEY SHAPE IS MATCHED EXACTLY: prefix plus 28 LOWERCASE hex and nothing else. A looser
    # match turns a mistyped key into a DNS lookup for an attacker-named host instead of a 404.
    #
    # `proxy_pass` CARRIES NO URI PART, and must not. Inside a regex location nginx cannot
    # determine which part of the request URI the location matched, so a URI here is not merely
    # unnecessary — it replaces the request path outright, and a stray trailing slash would
    # collapse every app request to `/`. This file's own BACKEND_URL boot guard exists because
    # that exact collapse already happened once on the backend hop.
    location ~ "^/a/((?:sbx|pub)-[0-9a-f]{28})(?:/|$)" {
        set $app_key $1;
        set $app_host "$app_key.${APPS_DOMAIN}";
        add_header Set-Cookie $app_set_cookie always;
        proxy_pass https://$app_host;
    }

    # Anything else under /a/ is a malformed or truncated key. It gets the 404 page and is NEVER
    # allowed to fall through to the keyless arm below, which would resolve it from a Referer or
    # cookie and serve SOMEONE ELSE'S APP under the address the person typed. `/a/<key>/../`
    # lands here too: nginx normalizes the URI before location matching, so it collapses to
    # `/a/` and never reaches an upstream.
    location ~ "^/a/" { error_page 404 = @app_gone; return 404; }

    # THE KEYLESS ARM. Resolves the app from the page that produced the request, then PREPENDS
    # the key before proxying.
    #
    # PREPENDING IS THE WHOLE POINT. Under `basePath` Next gates every route behind the prefix,
    # route handlers included, so `/api/items` proxied to the right container UNCHANGED is
    # answered with the framework's own 404. Composing `/a/<key>/api/items` is the difference
    # between this fallback working and this fallback being decorative — and a test that only
    # asserts the upstream HOST passes either way, which is how the defect survives review.
    #
    # `rewrite` is used rather than a URI on `proxy_pass` because a variable upstream with a URI
    # replaces the path outright. The replacement carries no `?`, so nginx appends the original
    # query string on its own.
    location / {
        set $app_key $keyless_app_key;
        # `return` is one of the two constructs that are safe inside `if` in a location context.
        if ($app_key = "") { error_page 404 = @app_gone; return 404; }
        set $app_host "$app_key.${APPS_DOMAIN}";
        rewrite ^(.*)$ /a/$app_key$1 break;
        proxy_pass https://$app_host;
    }

    # The person who reaches this is a BIAL employee who was sent a link, not a developer. A
    # stale key, a reaped sandbox, a typo and a crashed container all land here, and the
    # difference between a bare nginx 404 and this page is the difference between a product that
    # looks finished and one that looks broken. It names no upstream and no hostname but the
    # portal's own.
    location @app_gone {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App not available</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f7f9;color:#1c2024}main{max-width:32rem;padding:2rem;text-align:center}h1{font-size:1.25rem;margin:0 0 .75rem}p{margin:0 0 1.5rem;line-height:1.6;color:#5b6570}a{display:inline-block;padding:.6rem 1.1rem;border-radius:.4rem;background:#1c2024;color:#fff;text-decoration:none}@media(prefers-color-scheme:dark){body{background:#111315;color:#e9ecef}p{color:#9aa4ae}a{background:#e9ecef;color:#111315}}</style></head><body><main><h1>This app is not available at this address</h1><p>The link may be out of date, or the app may have been stopped. Open the portal to find it, or ask whoever shared the link for a current one.</p><a href="${PORTAL_ORIGIN}">Go to the BIAL app portal</a></main></body></html>';
    }
}

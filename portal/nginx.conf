# Frontend edge. TWO SITES on one listen port, told apart by Host:
#   1. the portal  — the built SPA + the API proxy to FastAPI (server_name _)
#   2. the apps    — generated apps at /a/<key>/, reverse-proxied to their own containers
#                    (server_name ${APPS_HOSTNAME}). A preview's key is a random alias the
#                    edge resolves through the backend; a published app's key is its name.
#
# Portal proxying mirrors the Vite dev proxy (portal/vite.config.js): /api/v1/auth strips
# /api; other /api/* rewrites /api->/v1; /apps passes through. ${PORT}, ${BACKEND_URL},
# ${APPS_DOMAIN}, ${APPS_HOSTNAME}, ${PORTAL_ORIGIN}, ${DNS_RESOLVER} and ${INTERNAL_ROUTE_TOKEN}
# are substituted from the environment at container start (nginx envsubst on templates); nginx's
# own $host/$uri variables have no braces and are left untouched, as are the runtime
# $backend_upstream, $app_key and $app_host variables defined below.
#
# WHY ONE CONTAINER SERVES BOTH. The apps need a public hostname BIAL's certificate already
# covers, and the gateway already has a backend pool pointing here. A separate router
# deployable would need its own image, its own gateway backend pool and its own health probe
# — three more asks of an infrastructure team that is the long pole on this project. nginx
# already performs this exact hop for the backend (request-time DNS + SNI to a VNet-private
# Azure upstream), so the apps site is the same hop with a different upstream.
#
# WHY A SHARED HOSTNAME WITH THE KEY IN THE PATH, rather than one hostname per app. BIAL
# refused a wildcard certificate for `*.citizenapps.bialairport.com`, and a single-label
# certificate cannot cover per-app subdomains. Every app therefore shares one browser origin.
# That is a known, accepted cost recorded in the plan, not an oversight.

# Both sites answer as plain `nginx`, never with the version.
server_tokens off;

# ---------------------------------------------------------------------------------------
# http-context maps. These MUST sit outside every server block: conf.d/*.conf is included
# inside `http`, which is the only context `map` is valid in. They are evaluated lazily, so
# a map whose value names $app_key reads whatever the matched location set.
# ---------------------------------------------------------------------------------------

# WebSocket upgrade passthrough. `Connection` is a hop-by-hop header: forwarding the client's
# verbatim would send `close` on a keep-alive connection and kill the tunnel, so it is derived
# instead. Without this pair the live-reload socket is answered as an ordinary request and the
# preview silently stops updating between edits — a clean compile reported over a stale page.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The apps site's access log. `log_format` is an http-context directive — declaring it inside
# the server block below is an `[emerg] "log_format" directive is not allowed here` at load,
# so it lives up here with the maps while the `access_log` that selects it stays on the site.
#
# WHY A CUSTOM FORMAT. The distinction between "no such app" and "the app died" is deliberately
# NOT in the response — both are a flat 404, so nothing names the upstream to a browser — which
# means it has to survive somewhere an operator can read it. This is that place, and
# `$upstream_addr` is the field that carries it. MEASURED against nginx 1.31.4 rather than
# assumed, because the intuitive reading of `$upstream_status` is wrong:
#
#   unknown key (DNS miss)   status=404 upstream_status=-   upstream=-
#   app died (connect fail)  status=404 upstream_status=502 upstream=172.19.0.2:443
#
# So `upstream=-` means NO SUCH APP, and a real address means the app exists and is not
# answering. `$upstream_status` does NOT distinguish them: a refused connect reports 502 there
# even though nothing ever answered. The error log agrees and says it in words — "could not be
# resolved (3: Host not found)" against "connect() failed (111: Connection refused)", and
# `test_the_access_log_separates_no_such_app_from_a_dead_app` pins the access-log half.
log_format apps_router '$remote_addr "$request" host=$host status=$status upstream_status=$upstream_status upstream=$upstream_addr key=$app_key alias_cache=$alias_cache denied=$route_denied referer="$http_referer"';

# The preview entry route's line. It names the path and never the query, which carries the ticket.
log_format apps_entry '$remote_addr "$request_method $uri $server_protocol" host=$host status=$status upstream_status=$upstream_status upstream=$upstream_addr';

# --- keyless resolution (the apps site's `location /` uses these) ----------------------
# `basePath` rewrites what the FRAMEWORK generates. It does not touch a root-relative string
# the model typed by hand (`fetch("/api/items")`, `<img src="/logo.png">`, CSS `url(/hero.png)`)
# and it cannot touch what the browser asks for on its own (`/favicon.ico`). Those arrive with
# no key in the path and still have to reach the app that produced them.
#
# REFERER FIRST, COOKIE ONLY AS A LAST RESORT. A cookie on this host is last-write-wins across
# every app, so with two apps open in two tabs one app's form post would land in the other
# app's database — and since each app owns its own database, that is a write to someone else's
# data, not a broken image. `Referer` resolves each request against the page that produced it,
# so two tabs stay correct. Same-origin requests carry the full referring URL under the default
# referrer policy, which is what makes this the primary signal rather than the aspirational one.
#
# The referring URL is anchored to ${APPS_HOSTNAME} so a page on an unrelated host cannot name
# an app here. The optional port group is what lets the Docker-backed router test drive this
# on http://<host>:<port>; production traffic is https with no port.
map $http_referer $key_from_referer {
    default "";
    "~^https?://${APPS_HOSTNAME}(?::[0-9]+)?/a/([0-9a-f]{32}|pub-[0-9a-f]{28})(?:[/?#]|$)" $1;
}

# The fallback, for a top-level navigation that carries no `Referer` at all. Validated to the
# EXACT key shape before it can ever compose an upstream name: it is browser-supplied and it
# reaches a DNS lookup from this container's network position, so an unvalidated value is a
# request-forgery primitive, not merely a bad route. Read off the whole Cookie header because the
# name carries a hyphen, which `$cookie_*` cannot spell.
map $http_cookie $key_from_cookie {
    default "";
    "~(?:^|;\s*)__Host-bial_app=([0-9a-f]{32}|pub-[0-9a-f]{28})(?:;|$)" $1;
}

# Referer wins; the cookie answers only when there is no usable Referer at all.
map $key_from_referer $keyless_app_key {
    default $key_from_referer;
    ""      $key_from_cookie;
}

# --- alias resolution ------------------------------------------------------------------------
# A preview's key in the address is a random alias, and the container behind it is known only to
# the backend. The apps site asks for it with `auth_request` and caches the answer.
#
# THE LOOKUP'S ALIAS COMES FROM MAPS, NEVER FROM A `set`. A server-level `set` runs again inside the
# subrequest, where it would give every alias the same value: one cache key, and every app routed
# to the container that was looked up first. `$request_uri` and the request headers are the
# original request's inside the subrequest too. A keyless request has no alias in its
# address, so the alias arm's value wins and the Referer/cookie one answers only when it is empty.
map $request_uri $alias_from_uri {
    default "";
    "~^/a/([0-9a-f]{32})(?:[/?#]|$)" $1;
}
map $keyless_app_key $keyless_alias {
    default "";
    "~^([0-9a-f]{32})$" $1;
}
map $alias_from_uri $lookup_alias {
    default $alias_from_uri;
    ""      $keyless_alias;
}

# The upstream host is composed from the key and the container the lookup named, and only from a
# container name of the exact shape: the answer is data from another system, and an unchecked one
# would reach a DNS lookup from this container's network position. Anything else — no answer, an
# unknown alias, a malformed name — lands on a name that never resolves, which fails as a 502 into
# `@app_gone`. `.invalid` is reserved to never resolve. A published app's name needs no lookup.
map "$app_key|$route_container" $app_host {
    default "unresolvable.invalid";
    "~^(pub-[0-9a-f]{28})\|$" "$1.${APPS_DOMAIN}";
    "~^[0-9a-f]{32}\|((?:sbx|shr)-[0-9a-f]{28})$" "$1.${APPS_DOMAIN}";
}

# A lookup that named no container must not be cached: the alias may be minted a moment later.
map $upstream_http_x_app_container $alias_answer_is_empty {
    default 0;
    ""      1;
}

# What the lookup's cache did, for the access log: HIT, MISS, or nothing for a key that needs no
# lookup. Copied out of the subrequest by `auth_request_set`.
map $alias_cache_raw $alias_cache {
    default $alias_cache_raw;
    ""      "-";
}

# --- the preview pass ------------------------------------------------------------------------
# A preview opens only for the person whose workspace runs it, and the browser proves who it is
# with the pass cookie. The edge only carries it to the lookup, shape-checked first, because it
# becomes a request header and part of a cache key.
map $http_cookie $preview_pass {
    default "";
    "~(?:^|;\s*)__Host-bial_pass=([A-Za-z0-9_-]{43})(?:;|$)" $1;
}

# A lookup that refuses this person carries a one-time binding. Only a navigation can follow a
# sign-in, so only a navigation is sent to the hand-over: `Sec-Fetch-Mode: navigate`, or no Fetch
# Metadata at all. A request carrying `Upgrade` never is, because Chromium sends no Fetch Metadata
# on a WebSocket handshake.
map "$route_denied_raw|$http_sec_fetch_mode|$http_upgrade" $handoff_binding {
    default "";
    "~^([0-9a-f]{32})\|(?:navigate)?\|$" $1;
}

# For the access log: whether the lookup refused this person. Never the binding itself.
map $route_denied_raw $route_denied {
    default "-";
    "~^[0-9a-f]{32}$" 1;
}

# The entry route's two inputs, shape-checked before they become headers to the backend.
map $http_cookie $preview_binding {
    default "";
    "~(?:^|;\s*)__Host-bial_handoff=([0-9a-f]{32})(?:;|$)" $1;
}
map $arg_ticket $preview_ticket {
    default "";
    "~^([A-Za-z0-9_-]{43})$" $1;
}

# A worker's scope stops at its script's directory unless the response widens it, and that header
# is hidden on this site. So a worker script is refused anywhere but inside an app's own
# `/a/<key>/`: from the root its scope would take in every app and the entry route, and from the
# bare `/a/<key>` every app.
map "$http_service_worker|$request_uri" $worker_outside_its_app {
    default 1;
    "~^\|" 0;
    "~^[^|]+\|/a/[^/?%]+/" 0;
}

# The edge's own cookies never reach an app. The pass and the binding are credentials, and the
# routing cookie names the last other app this browser opened. Each is stripped from the Cookie
# header sent upstream, every other cookie is kept as it was, and each name is stripped twice: the
# `__Host-` prefix keeps a browser to one copy per partition, but a browser can hold a partitioned
# copy beside the ordinary one, so an app can plant a second for one strip to miss. The unprefixed
# routing name is the one that cookie used to carry, with a container's name in it, and is stripped
# for as long as a browser still holds one.
map $http_cookie $cookie_pass_once {
    default $http_cookie;
    "~^(?<head>(?:.*?;\s*)?)__Host-bial_pass=[^;]*;\s*(?<tail>.*)$" "$head$tail";
    "~^(?:(?<head>.*?);\s*)?__Host-bial_pass=[^;]*$" $head;
}
map $cookie_pass_once $cookie_without_pass {
    default $cookie_pass_once;
    "~^(?<head>(?:.*?;\s*)?)__Host-bial_pass=[^;]*;\s*(?<tail>.*)$" "$head$tail";
    "~^(?:(?<head>.*?);\s*)?__Host-bial_pass=[^;]*$" $head;
}
map $cookie_without_pass $cookie_handoff_once {
    default $cookie_without_pass;
    "~^(?<head>(?:.*?;\s*)?)__Host-bial_handoff=[^;]*;\s*(?<tail>.*)$" "$head$tail";
    "~^(?:(?<head>.*?);\s*)?__Host-bial_handoff=[^;]*$" $head;
}
map $cookie_handoff_once $cookie_without_handoff {
    default $cookie_handoff_once;
    "~^(?<head>(?:.*?;\s*)?)__Host-bial_handoff=[^;]*;\s*(?<tail>.*)$" "$head$tail";
    "~^(?:(?<head>.*?);\s*)?__Host-bial_handoff=[^;]*$" $head;
}
map $cookie_without_handoff $cookie_app_once {
    default $cookie_without_handoff;
    "~^(?<head>(?:.*?;\s*)?)(?:__Host-)?bial_app=[^;]*;\s*(?<tail>.*)$" "$head$tail";
    "~^(?:(?<head>.*?);\s*)?(?:__Host-)?bial_app=[^;]*$" $head;
}
map $cookie_app_once $cookie_for_app {
    default $cookie_app_once;
    "~^(?<head>(?:.*?;\s*)?)(?:__Host-)?bial_app=[^;]*;\s*(?<tail>.*)$" "$head$tail";
    "~^(?:(?<head>.*?);\s*)?(?:__Host-)?bial_app=[^;]*$" $head;
}

# One small cache for the lookup's answers, found ones only (see the lookup location).
proxy_cache_path /var/cache/nginx/alias_routes keys_zone=alias_routes:1m max_size=2m inactive=5m use_temp_path=off;

# The routing cookie, written ONLY on a top-level navigation.
#
# WITHOUT THE `Sec-Fetch-Mode: navigate` GATE this is a cross-site attack primitive: any page
# anywhere could force a write with a single `<img src="https://${APPS_HOSTNAME}/a/<their-key>/x">`,
# and every subsequent keyless call from the victim's own app would be silently redirected to
# the attacker's container, carrying whatever that app sends. Accidental mis-routing between a
# person's own tabs is accepted; a third party steering it is not.
#
# ATTRIBUTES ARE LOAD-BEARING. No `Domain`, so the cookie stays host-only to the apps hostname
# and is never sent to the portal. `Secure` + `HttpOnly` throughout. Plain `SameSite=Lax` works
# INSIDE THE PORTAL'S IFRAME only because the portal and the apps hostname share the registrable
# domain `bialairport.com`, which makes them same-site despite being different origins. If the
# portal ever moves to a different domain this fallback stops working in the frame, silently,
# and `SameSite=None; Secure` becomes required. Do not "tidy" this to `Strict`.
#
# An empty map value emits NO header at all (nginx skips a zero-length add_header value), which
# is what makes the non-navigate case a true no-op rather than a cookie with no attributes.
# TWO SIGNALS, NOT ONE. `Sec-Fetch-Mode: navigate` alone still admits a CROSS-SITE top-level
# navigation — a link or a `window.open` from any page on the internet — so an attacker who gets
# one click can still plant the routing cookie and repoint the victim's later keyless calls.
# `Sec-Fetch-Site` is what closes that: a real in-app navigation is `same-origin`, and the
# gateway redirect that lands someone on an app is `none` (a typed address or a bookmark).
# `cross-site` is the one value that must never write, and it is the only one an attacker
# controls.
map "$http_sec_fetch_mode:$http_sec_fetch_site" $app_set_cookie {
    default "";
    "~^navigate:(same-origin|same-site|none)$" "__Host-bial_app=$app_key; Path=/; Secure; HttpOnly; SameSite=Lax";
}

# IS THIS REQUEST BEING DRAWN INSIDE A FRAME? `Sec-Fetch-Dest` is the browser's own answer, sent
# on every request by every engine that ships the Fetch Metadata headers this file already relies
# on two maps above.
#
# WHY @app_gone HAS TO ASK. That page was written for ONE reader: somebody who was sent a link to
# an app, opened it in a TAB, and finds it gone. For them a button back to the portal is exactly
# right. The workspace's preview pane then framed the very same page — and an `<a href>` with no
# target navigates ITS OWN frame, so pressing the button loaded the whole portal inside the
# preview rectangle. Portal inside portal, reported from production.
#
# AND THE OBVIOUS ONE-ATTRIBUTE FIX IS NOT AVAILABLE. `target="_top"` would be REFUSED by the
# browser: `LivePreview.tsx` frames the app with `sandbox="allow-scripts allow-same-origin
# allow-forms allow-downloads"` and deliberately WITHHOLDS `allow-top-navigation`, because the
# framed app is unreviewed agent-generated code and top-nav would hand every generated app the
# ability to redirect the citizen's whole tab. Widening the sandbox to fix a 404 page would open a
# phishing surface across every app on the platform. So the page adapts instead: framed, it offers
# no navigation at all, because no navigation it could offer would work.
#
# FAILS TOWARDS THE TOP-LEVEL PAGE. A client that sends no `Sec-Fetch-Dest` gets the full page
# with its button — the pre-Fetch-Metadata browser reading a shared link is exactly who needs it,
# and a button that is merely unnecessary is a far smaller harm than a dead end for someone who
# actually is in a tab.
map $http_sec_fetch_dest $app_gone_is_framed {
    default   0;
    "iframe"  1;
    "frame"   1;
    "embed"   1;
    "object"  1;
}

# ---------------------------------------------------------------------------------------
# SITE 1 — THE PORTAL. THIS BLOCK MUST STAY FIRST ON THE LISTEN ADDRESS.
# nginx serves a request whose Host matches no server_name from the FIRST block declared on
# that address. Move the apps block above this one and every portal request with an unexpected
# Host is served by the apps site instead — the portal goes dark, and `nginx -t` stays green.
# ---------------------------------------------------------------------------------------

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's 1 MiB default would 413 two real bodies before they reach FastAPI, so this has to
    # clear the larger of them:
    #   * a turn body, which still carries attachment text INLINE — `attachment_texts`, capped at
    #     8 blocks x 600,000 chars (api/v1/conversations/_shared.py) — so it is not "small", and
    #     a multibyte-heavy set of blocks is the worst case this has to clear;
    #   * an attachment upload, refused above `_BODY_LIMIT_BYTES` by the router itself
    #     (api/v1/attachments/router.py), which has to clear base64 of the largest legal file.
    # 45m sits just above that ceiling, so the authoritative refusal stays in FastAPI, where it
    # names the limit for the file's type instead of answering with nginx's bare 413.
    client_max_body_size 45m;

    # Baseline security headers. A location-level add_header REPLACES all inherited
    # add_headers, so the /assets/ and =/index.html blocks below re-declare these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The backend sets these four as well. Hidden on every proxied response so each reaches
    # the browser once, with this edge's value. `strict-origin-when-cross-origin` is the one
    # that must win: the sign-in callback's form post is refused if it arrives with `Origin: null`.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;

    # The FRAMING policy, on everything this site serves except the SPA document. frame-src permits
    # the origins the cockpit may frame a live app on; frame-ancestors 'self' keeps the portal itself
    # un-frameable. DELIBERATELY only framing here: the sign-in callback page carries the backend's own
    # nonce policy, browsers enforce every CSP a response carries, and a `script-src 'self'` from this
    # edge would block that nonce script and with it every sign-in. The full policy lives on
    # `= /index.html`, the only location that serves the SPA document.
    #
    # ONE ORIGIN, and the ACA wildcard that used to sit beside it is GONE. It was kept only while
    # the portal was still handing the browser a `*.${APPS_DOMAIN}` preview URL; that address has
    # now moved to `https://${APPS_HOSTNAME}/a/<app-name>/`, so the wildcard permitted framing an
    # origin nothing produces any more. Removing it in the same change that moves the address is
    # what makes both halves safe: revoking it earlier would have blanked every preview in flight
    # with nothing but a console message and no server-side trace at all.
    #
    # DO NOT RE-ADD IT to "support direct ACA previews". An internal Container Apps environment
    # publishes no public DNS, so that origin does not resolve from a BIAL desk — which is the
    # entire reason this design exists. ${APPS_DOMAIN} is still required, but its job now is
    # composing the router's upstream, not this header.
    #
    # Declared in the SERVER block so the proxied locations INHERIT it, and re-declared byte-identical
    # in `/assets/`, which overrides headers (a location add_header replaces ALL inherited ones).
    # Both variables are substituted at container start and both
    # are REQUIRED inputs (the 19-require-apps-domain.sh entrypoint guard refuses to boot if either
    # is unset/empty or malformed, so envsubst never emits a bare `https://`).
    add_header Content-Security-Policy "frame-src 'self' https://${APPS_HOSTNAME}; frame-ancestors 'self'" always;

    # Common proxy headers (inherited by every proxied location below).
    proxy_http_version 1.1;
    # Host MUST be the upstream's own hostname ($proxy_host — nginx's default when no
    # override exists), NOT the browser's host: Azure App Service routes requests by Host,
    # so forwarding the portal's public host makes Azure's front door reject the hop with
    # its platform 403/404 pages before the backend ever runs. Dev uvicorn ignores Host,
    # which is exactly why this only ever broke on App Service and never showed up in local
    # testing. The browser-facing host still travels in X-Forwarded-Host for any absolute-URL
    # reconstruction.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Present SNI on upstream TLS (nginx defaults this OFF): App Service's HTTPS front
    # door needs it to select the right certificate. No-op for plain-http upstreams (dev).
    proxy_ssl_server_name on;

    # Re-resolve the backend hostname at request time (30s TTL) instead of pinning the
    # single answer nginx got at config load. A literal proxy_pass hostname is resolved
    # ONCE at container start — on App Service that froze a pre-private-endpoint public IP
    # for the container's whole lifetime and every /api call died on Azure's
    # "Web App - Unavailable" 403 block page. proxy_pass via a variable forces a runtime
    # lookup through this resolver. DNS_RESOLVER is a REQUIRED deploy input (fail-first;
    # the 19-require boot guard refuses to start without it): 168.63.129.16 on Azure
    # (resolves private-endpoint zones through the VNet), 127.0.0.11 under local Docker.
    # resolver_timeout bounds a resolver blip to 5s instead of nginx's 30s default —
    # failed lookups are not negative-cached, so every request during an outage would
    # otherwise hang the full 30s.
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream ${BACKEND_URL};

    # Entra auth: strip /api so /api/v1/auth/* -> backend /v1/auth/* (keeps the
    # refresh-cookie Path + OIDC redirect_uri byte-identical to dev). More specific
    # than /api/ below, so nginx's longest-prefix match routes auth here.
    location /api/v1/auth/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend_upstream;
    }

    # The control plane's health route is for the platform's own checks, which reach the control
    # plane directly; from the public portal it does not exist.
    location ~ "^/api/(?:v1/)?health(?:/|$)" {
        default_type application/json;
        return 404 '{"detail":"This route does not exist"}';
    }

    # Business API: the SPA calls /api/<domain>; the backend serves /v1/<domain>. The
    # build-session control API (/api/build-sessions/*) rides this block like any other domain.
    location /api/ {
        rewrite ^/api(/.*)$ /v1$1 break;
        proxy_pass $backend_upstream;
        # SSE (the turn stream, /api/conversations/{id}/events): stream deltas, don't buffer,
        # allow long turns.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # NO LIVE CALLER, AND DELETING IT IS THE WORSE OPTION. The runner shell and same-origin
    # frame this used to name are retired — the backend answers nothing at bare `/apps/` (its
    # only `/apps` prefix lives under `/v1`), and a deployed app is served by SITE 2 below at
    # `/a/<key>/`, never from here. The SPA deliberately declares no `/apps/:appId` route, so
    # no traffic reaches this location today.
    #
    # It stays because removing it does not produce the honest 404 that removing it looks like
    # it would: `/apps/…` would fall through to the SPA history fallback at the bottom of this
    # block and be answered with `index.html` and a 200, so a stale app link would render the
    # portal shell instead of failing. Proxying instead leaves the answer to the control plane,
    # which 404s it as JSON wherever the SPA is not also mounted there. That caveat is the
    # point: the backend's own history fallback reserves `v1` and `api` only, so the honest 404
    # depends on the backend not serving the SPA — not on this block by itself. Re-verified
    # against both topologies on 2026-08-26 and recorded in the deployment runbook, which
    # reached the same conclusion and chose to keep it. Pinned by
    # `portal/src/__tests__/nginx-apps-routing.test.ts`.
    location /apps/ {
        proxy_pass $backend_upstream;
    }

    # Hashed, immutable SPA bundles. Re-declares the baseline headers (a location add_header
    # replaces ALL inherited ones), so it must ALSO re-declare the CSP — otherwise these
    # static files would lose the inherited frame-src/frame-ancestors policy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-src 'self' https://${APPS_HOSTNAME}; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # index.html is never cached, so a new deploy's asset hashes are always picked up. `/` and every
    # SPA route reach this location by internal redirect, so this is the one place the document is
    # served and the one place its full policy is declared. `'unsafe-inline'` on styles is required:
    # the dialog, select and scroll-lock primitives inject `<style>` elements at runtime.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' https://${APPS_HOSTNAME}; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    # SPA history fallback: anything else resolves to a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------------------
# SITE 2 — THE APPS. Generated apps, addressed as https://${APPS_HOSTNAME}/a/<key>/…
#
# The key is either a preview's or shared view's ALIAS — 32 lowercase hex, random, new for every
# container — or a published app's name, `pub-` plus 28 lowercase hex. A published name IS the
# container app's name, so its upstream is a string composition. An alias is resolved to its
# container by the internal lookup below, so a browser never holds a preview's container name and
# a container name in the address is refused. Either way an unknown key is a DNS MISS, not a
# lookup miss, so it has to be turned into an explicit 404 here (see @app_gone) or it would
# surface as a 502 naming the upstream and disclosing the environment's naming convention.
#
# ONLY TWO THINGS HERE REACH THE BACKEND, the internal alias lookup and the preview entry route,
# and neither for a published app. A generated app must not be able to reach the control plane on
# its own origin: the lookup location is `internal`, so no request from a browser or an app can
# name it; the entry route can be named, so it forwards nothing of the request but a ticket and a
# binding, to the one backend route that redeems them. The portal site above proxies neither.
#
# NO RESPONSE HEADERS ARE ADDED ON THIS SITE, and that is a decision rather than an omission.
# The app's own headers must reach the browser untouched — above all the sandbox Caddy's
# `Content-Security-Policy: frame-ancestors <portal-origin>`, which is the single authority on
# who may frame an app. Adding the portal's baseline `X-Frame-Options: SAMEORIGIN` here would
# break framing outright, since XFO cannot express an allowed cross-origin ancestor.
# ---------------------------------------------------------------------------------------
server {
    listen ${PORT};
    server_name ${APPS_HOSTNAME};

    # THE ENTIRE PROXY PREAMBLE IS RE-DECLARED HERE ON PURPOSE. nginx inherits directives
    # downward (http -> server -> location) and NEVER between sibling `server` blocks, and both
    # of the omissions that matter fail silently past `nginx -t`:
    #   - without `proxy_http_version 1.1` this block defaults to HTTP/1.0 and answers a
    #     WebSocket upgrade as an ordinary request, which is the live-reload death above;
    #   - without its own `resolver` the variable `proxy_pass` fails at request time and every
    #     app request is a 502 — the outcome the explicit 404 below exists to prevent.
    client_max_body_size 40m;
    proxy_http_version 1.1;
    # The app's own headers pass through untouched (see above) except these two, which name the
    # software behind the app and nothing the browser needs.
    proxy_hide_header Via;
    proxy_hide_header X-Powered-By;
    # This one would let an app's service worker claim a scope wider than its own `/a/<key>/`.
    proxy_hide_header Service-Worker-Allowed;
    # Host and SNI are the COMPOSED upstream name, not the browser's host: ACA routes by Host
    # and selects its certificate by SNI, so the container app's own FQDN must travel in both
    # or the environment's front door rejects the hop before the app ever runs. Set explicitly
    # from $app_host rather than left to nginx's $proxy_host default, so the value a test reads
    # is the value the config states.
    proxy_set_header Host $app_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $app_host;
    proxy_set_header Cookie $cookie_for_app;
    # An app's `X-Accel-Redirect` would otherwise be followed to any `internal` location, the
    # lookup's included.
    proxy_ignore_headers X-Accel-Redirect;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Request-time DNS, for the same reason the portal block gives: a literal proxy_pass
    # hostname is resolved ONCE at container start, and these upstreams come and go constantly.
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;
    # Next streams its RSC payload, and the live-reload socket idles for minutes between two
    # model edits. Buffering would hold the stream; the 60s default read timeout would cut the
    # socket. NOTE: the Application Gateway sits IN FRONT of this and the shortest hop governs,
    # so this cannot compensate for the gateway's own request timeout — that is a named BIAL
    # prerequisite, not something nginx can fix from here.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # An upstream error is not shown to the browser as itself. nginx's own 502 body and its
    # default error page can name the composed upstream, which would hand anyone who can reach
    # the gateway the environment's naming convention.
    #
    # nginx installs NO default `proxy_redirect` rule when `proxy_pass` uses a variable, so an
    # absolute `Location` from the app passes through verbatim — handing the browser the
    # container's own FQDN, which resolves for nobody on an internal environment. Only the
    # container's origin is dropped: an app under a base path already puts the prefix in its own
    # absolute `Location`, so it is carried once and the container is never named.
    proxy_redirect https://$app_host/ /;
    proxy_redirect http://$app_host/ /;

    proxy_intercept_errors on;
    error_page 502 503 504 = @app_gone;

    # NO SERVER-LEVEL `set` ON THIS SITE (see the alias maps): `$app_key` is set by each arm and
    # `$app_host` is a map.

    access_log /var/log/nginx/access.log apps_router;

    # THE SUPERVISOR IS NEVER REACHABLE FROM A BROWSER. It is bearer-guarded downstream, but
    # that guard was designed for a different threat and this is the layer where the invariant
    # is claimed, so it is enforced here too. `^~` outranks the regex locations below; the
    # second form catches the same surface behind a valid key, which the app's own Caddy would
    # fall through to `next dev` rather than serve, but which must not depend on that.
    # BOUNDED, not a bare prefix. `^~ /_sup` would also swallow an app's own `/_super-admin`
    # route and answer it 404 with no way for the app to know why — a bare prefix here quietly
    # reserves a namespace the apps were never told about.
    location ~ "^/_sup(?:/|$)" { return 404; }
    location ~ "^/a/[^/]+/_sup(?:/|$)" { return 404; }

    # NEXT'S SOURCE AND ITS DEV SURFACE ARE NEVER SERVED. Browser source maps carry the original
    # source; `/_next/mcp` is the dev server's agent interface (its logs, errors, routes and project
    # metadata); `/_next/development/` and every `__nextjs_` route belong to Next's devtools, which
    # the sandbox runs with its overlay switched off. Nothing a preview shows calls one, while
    # `restart_dev` and the inspector attach would hand any visitor a lever on the dev server.
    # Placed before both proxy arms, and matching with or without a key, because Next's dev client
    # asks for some of these root-relative. Maps are matched only under `/_next/`, where Next emits
    # them, so an app's own `.map` route still reaches it. ANCHORED: unanchored, `.*` restarts at
    # every `/_next/` in the URI and one crafted request line costs a worker milliseconds.
    location ~ "^(?:/a/[^/]+)?/(?:_next/(?:.*\.map$|mcp|development/)|__nextjs_)" { return 404; }

    # THE KEYED ARMS. The prefix is real end to end: it arrives here, it is forwarded unchanged,
    # the app's in-container Caddy passes it through untouched, and the app itself is configured
    # to live at it. Stripping it here and letting the app think it is at the root was the
    # cheaper design and was rejected — the app would then generate root-relative links, the key
    # would vanish from the address bar on the first in-app navigation, and every shared or
    # bookmarked link would break.
    #
    # THE KEY SHAPE IS MATCHED EXACTLY: 32 lowercase hex, or `pub-` plus 28. A looser match turns
    # a mistyped key into a DNS lookup for an attacker-named host instead of a 404. A container
    # name for a preview (`sbx-`, `shr-`) matches neither arm and lands on the 404 below.
    #
    # `proxy_pass` CARRIES NO URI PART, and must not. Inside a regex location nginx cannot
    # determine which part of the request URI the location matched, so a URI here is not merely
    # unnecessary — it replaces the request path outright, and a stray trailing slash would
    # collapse every app request to `/`. This file's own BACKEND_URL boot guard exists because
    # that exact collapse already happened once on the backend hop.
    #
    # THE ALIAS ARM asks the lookup which container the alias stands for; `$route_container` is
    # what the map composes the upstream from. `$alias_from_uri` reads the raw request URI while
    # this location matched the normalized one, so a request whose two disagree (`/a/<x>/../..`)
    # is refused rather than looked up under one alias and routed under another.
    #
    # A lookup that refuses this person names no container, so the request fails into `@app_gone`
    # like an unknown alias, carrying the refusal's binding with it.
    location ~ "^/a/([0-9a-f]{32})(?:/|$)" {
        set $app_key $1;
        if ($alias_from_uri != $app_key) { error_page 404 = @app_gone; return 404; }
        if ($worker_outside_its_app) { error_page 404 = @app_gone; return 404; }
        auth_request /__bial_route;
        auth_request_set $route_container $upstream_http_x_app_container;
        auth_request_set $route_denied_raw $upstream_http_x_route_denied;
        auth_request_set $alias_cache_raw $upstream_cache_status;
        add_header Set-Cookie $app_set_cookie always;
        proxy_pass https://$app_host;
    }

    # A PUBLISHED APP's name is its container's, so it needs no lookup and never calls the backend.
    location ~ "^/a/(pub-[0-9a-f]{28})(?:/|$)" {
        set $app_key $1;
        if ($worker_outside_its_app) { error_page 404 = @app_gone; return 404; }
        add_header Set-Cookie $app_set_cookie always;
        proxy_pass https://$app_host;
    }

    # Anything else under /a/ is a malformed or truncated key. It gets the 404 page and is NEVER
    # allowed to fall through to the keyless arm below, which would resolve it from a Referer or
    # cookie and serve SOMEONE ELSE'S APP under the address the person typed. `/a/<key>/../`
    # lands here too: nginx normalizes the URI before location matching, so it collapses to
    # `/a/` and never reaches an upstream.
    location ~ "^/a/" { error_page 404 = @app_gone; return 404; }

    # THE KEYLESS ARM. Resolves the app from the page that produced the request, then PREPENDS
    # the key before proxying.
    #
    # PREPENDING IS THE WHOLE POINT. Under `basePath` Next gates every route behind the prefix,
    # route handlers included, so `/api/items` proxied to the right container UNCHANGED is
    # answered with the framework's own 404. Composing `/a/<key>/api/items` is the difference
    # between this fallback working and this fallback being decorative — and a test that only
    # asserts the upstream HOST passes either way, which is how the defect survives review.
    #
    # `rewrite` is used rather than a URI on `proxy_pass` because a variable upstream with a URI
    # replaces the path outright. The replacement carries no `?`, so nginx appends the original
    # query string on its own.
    location / {
        set $app_key $keyless_app_key;
        # `return` is one of the two constructs that are safe inside `if` in a location context.
        if ($app_key = "") { error_page 404 = @app_gone; return 404; }
        # The lookup prefers an alias in the raw URI, so a path that names one and normalizes away
        # from `/a/` would be looked up under it and routed under the Referer's.
        if ($alias_from_uri != "") { error_page 404 = @app_gone; return 404; }
        if ($worker_outside_its_app) { error_page 404 = @app_gone; return 404; }
        auth_request /__bial_route;
        auth_request_set $route_container $upstream_http_x_app_container;
        auth_request_set $route_denied_raw $upstream_http_x_route_denied;
        auth_request_set $alias_cache_raw $upstream_cache_status;
        rewrite ^(.*)$ /a/$app_key$1 break;
        proxy_pass https://$app_host;
    }

    # THE INTERNAL ALIAS LOOKUP. Only `auth_request` reaches it: `internal` refuses a browser, and
    # the server's `X-Accel-Redirect` ignore refuses an app. A key that is not an alias is answered
    # here with no backend call. The backend answers 200 always: the container name in
    # `X-App-Container` when the alias is current and the pass is its holder's, a binding in
    # `X-Route-Denied` when the alias is current and the pass is not. The subrequest passes only
    # 2xx, 401 and 403 and turns anything else into a 500, and a refusal cannot be a 401 either:
    # this server intercepts errors, so an `error_page 401` on the arms would swallow an app's own.
    #
    # Caching does nothing silently with `proxy_buffering off` (this server's default) or with the backend's `no-store`, so
    # buffering is switched on and the backend's cache, cookie and Vary headers are ignored. The
    # cache key is the alias and the pass together, so one person's found answer is never served to
    # another's pass, and only an answer that names a container is stored, so an alias minted a
    # moment after a miss is found at once and a refusal is asked again. Setting any
    # `proxy_set_header` here drops the server's inherited set, and `proxy_pass_request_headers off`
    # keeps every browser header and the body from reaching the backend; the Host and SNI are the
    # backend's own.
    location = /__bial_route {
        internal;
        if ($lookup_alias = "") { return 200; }
        proxy_pass ${BACKEND_URL}/internal/app-routes/$lookup_alias;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $proxy_host;
        proxy_ssl_name $proxy_host;
        # Sent even with request headers off, so a POST's length would arrive with no body behind it.
        proxy_set_header Content-Length "";
        proxy_set_header X-Internal-Route-Token "${INTERNAL_ROUTE_TOKEN}";
        proxy_set_header X-Preview-Pass $preview_pass;
        # A backend that cannot answer is "no route", not an error: the subrequest passes only 2xx,
        # 401 and 403, and turns anything else into a bare 500 for the browser.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @route_unknown;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_buffering on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires X-Accel-Redirect;
        proxy_cache alias_routes;
        proxy_cache_key $lookup_alias|$preview_pass;
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;
        proxy_no_cache $alias_answer_is_empty;
    }

    location @route_unknown { return 200; }

    # THE PREVIEW ENTRY. The portal's hand-over sends the browser here with a one-time ticket; the
    # backend redeems it against the binding cookie and answers with a redirect that sets the pass,
    # which reaches the browser unchanged. Any request can name this location, so request headers
    # and the body are off, and only the shape-checked ticket and binding go upstream. The route
    # sits in a variable so the backend's name resolves at request time and the query, which
    # carries the ticket, is never appended. Its own `error_page` keeps a failure from ending in
    # `@app_gone`, whose log line carries the query.
    location = /__bial_enter {
        set $preview_entry_route /internal/preview-pass;
        proxy_pass ${BACKEND_URL}$preview_entry_route;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $proxy_host;
        proxy_ssl_name $proxy_host;
        proxy_set_header Content-Length "";
        proxy_set_header X-Internal-Route-Token "${INTERNAL_ROUTE_TOKEN}";
        proxy_set_header X-Preview-Ticket $preview_ticket;
        proxy_set_header X-Preview-Binding $preview_binding;
        proxy_redirect off;
        error_page 500 502 503 504 https://${APPS_HOSTNAME}/__bial_gone;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        access_log /var/log/nginx/access.log apps_entry;
    }

    # Where a refused hand-over or entry ends. It never bounces: no lookup runs on the way here.
    location = /__bial_gone { error_page 404 = @app_gone; return 404; }

    # The person who reaches this is a BIAL employee who was sent a link, not a developer. A
    # stale key, a reaped sandbox, a typo and a crashed container all land here, and the
    # difference between a bare nginx 404 and this page is the difference between a product that
    # looks finished and one that looks broken. It names no upstream and no hostname but the
    # portal's own.
    #
    # TWO READERS, TWO PAGES — see the `$app_gone_is_framed` map for why one page could not serve
    # both. In a TAB the reader was sent a link and needs a way back to the portal. In the
    # workspace's PREVIEW PANE the reader is the citizen who built the app, is already inside the
    # portal, and cannot be offered a link out of a sandboxed frame that forbids top navigation —
    # so the framed page carries no button, drops the "ask whoever shared the link" advice that
    # makes no sense addressed to the app's own author, and says the one true thing instead.
    location @app_gone {
        default_type text/html;
        add_header Cache-Control "no-store" always;

        # A preview the lookup refused to this person, reached by a navigation: off to the portal's
        # hand-over, which can issue a pass, with the binding cookie that ties its ticket to this
        # browser. An `add_header` inside `if` replaces every inherited one, so no-store is repeated.
        if ($handoff_binding) {
            add_header Cache-Control "no-store" always;
            add_header Set-Cookie "__Host-bial_handoff=$handoff_binding; Path=/; Max-Age=600; Secure; HttpOnly; SameSite=Lax" always;
            return 302 ${PORTAL_ORIGIN}/api/v1/auth/preview-handoff/$handoff_binding/$lookup_alias$request_uri;
        }

        # `return` is one of the two constructs that are safe inside `if` in a location context —
        # the same reason the keyless arm above uses it.
        if ($app_gone_is_framed) {
            return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App not running</title><style>body{color-scheme:light;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f7f9;color:#1c2024}main{max-width:26rem;padding:2rem;text-align:center}h1{font-size:1.0625rem;margin:0 0 .5rem}p{margin:0;line-height:1.6;color:#5b6570;font-size:.875rem}</style></head><body><main><h1>This app isn&#39;t running right now</h1><p>Nothing you saved has been lost. Start it again to pick up where you left off.</p></main></body></html>';
        }

        return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App not available</title><style>body{color-scheme:dark light;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f7f9;color:#1c2024}main{max-width:32rem;padding:2rem;text-align:center}h1{font-size:1.25rem;margin:0 0 .75rem}p{margin:0 0 1.5rem;line-height:1.6;color:#5b6570}a{display:inline-block;padding:.6rem 1.1rem;border-radius:.4rem;background:#1c2024;color:#fff;text-decoration:none}@media(prefers-color-scheme:dark){body{background:#111315;color:#e9ecef}p{color:#9aa4ae}a{background:#e9ecef;color:#111315}}</style></head><body><main><h1>This app is not available at this address</h1><p>The link may be out of date, or the app may have been stopped. Open the portal to find it, or ask whoever shared the link for a current one.</p><a href="${PORTAL_ORIGIN}">Go to the BIAL app portal</a></main></body></html>';
    }
}

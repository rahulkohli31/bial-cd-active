# Frontend edge: serve the built SPA and proxy the API surface to the FastAPI backend.
# Mirrors the Vite dev proxy (portal/vite.config.js): /api/v1/auth strips /api; other
# /api/* rewrites /api->/v1; /apps and /preview pass through. ${PORT} and ${BACKEND_URL}
# are substituted from the environment at container start (nginx envsubst on templates);
# nginx's own $host/$uri variables have no braces and are left untouched.

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Common proxy headers (inherited by every proxied location below).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Entra auth: strip /api so /api/v1/auth/* -> backend /v1/auth/* (keeps the
    # refresh-cookie Path + OIDC redirect_uri byte-identical to dev). More specific
    # than /api/ below, so nginx's longest-prefix match routes auth here.
    location /api/v1/auth/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass ${BACKEND_URL};
    }

    # Business API: the SPA calls /api/<domain>; the backend serves /v1/<domain>.
    location /api/ {
        rewrite ^/api(/.*)$ /v1$1 break;
        proxy_pass ${BACKEND_URL};
        # SSE (chat / app generation): stream deltas, don't buffer, allow long turns.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Runner shell + sandboxed frame + live preview (served by the backend; no rewrite).
    location /apps/ {
        proxy_pass ${BACKEND_URL};
    }
    location /preview {
        proxy_pass ${BACKEND_URL};
    }

    # Hashed, immutable SPA bundles.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is never cached, so a new deploy's asset hashes are always picked up.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback: anything else resolves to a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

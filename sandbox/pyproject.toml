# Sandbox-scoped pytest config (Track SANDBOX harness — plan D6).
#
# This file exists ONLY to give the sandbox test harness its OWN pytest rootdir = `sandbox/`.
# The harness is run under the backend interpreter + deps:
#
#     cd sandbox && uv run --project ../backend pytest            # offline lane (default)
#     cd sandbox && uv run --project ../backend pytest -m integration   # Docker + Azurite lane
#
# `uv run --project ../backend` supplies the interpreter and deps (azure-storage-blob, httpx,
# fastapi, pytest); pytest INDEPENDENTLY discovers THIS file as its config, so backend's own
# `pyproject.toml` (rooted at `backend/`, `testpaths=["tests"]`, and whose `tests/conftest.py`
# HARD-REQUIRES a live Postgres) is never the rootdir and never collected. No `backend/` file is
# edited — the only coupling is the read-only `sys.path` bridge in `tests/conftest.py` (D6, R8).
#
# There is no `[project]` table on purpose: `sandbox/` is not an installable package, and the
# harness imports backend's frozen contract modules via the bridge, not via an install.

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The offline supervisor suite (`supervisor/test_app.py`, non-spawning) + the harness (`tests/`).
testpaths = ["tests", "supervisor"]
# --strict-markers turns a typo'd marker into an error rather than a silent skip.
markers = [
    "integration: opt-in; needs Docker (in-container guards/framing/round-trip) + Azurite (Blob)",
]
# Default lane runs offline only; the Docker/Azurite lane is opt-in via `-m integration`,
# mirroring backend's own storage suite so `pytest` without services gives a clean skip, not a hang.
addopts = "-m 'not integration' --strict-markers"

# Ruff config for the sandbox tree (the plan's ship gate is `ruff check`/`ruff format` on
# sandbox/ Python). Mirrors backend's rule set + line-length.
#
# py313 because the image now ships Python 3.13 (the Debian 13 base's python3, up from 3.11 on
# bookworm). This target governs `test_app.py` AND `supervisor/app.py` (U29 dropped the
# `extend-exclude` below — see that unit for why) — which run under the backend's 3.14 env, a
# superset. Verified zero delta when moving py311 -> py313: `ruff check` and `ruff format --check`
# are clean on both.
[tool.ruff]
target-version = "py313"
line-length = 99
# U29 REMOVED the `extend-exclude = ["supervisor/app.py"]` that used to sit here. Its "frozen,
# forked verbatim from the proven spike" rationale had gone stale: the file had grown to ~1150
# lines against the spike's 228, and it is the one file that runs on the shipped image ruff had
# never linted (ASM33). The fix here was DELIBERATELY CAPPED to `ruff format` plus non-behavioural
# lint fixes (imports, unused names, style) — any change to control flow, exception handling, or a
# subprocess invocation was left alone for its own follow-up with its own review, because this file
# spawns the dev server and builds the fail-closed child environment and no CI covers a bad autofix
# here before it ships. `supervisor/test_app.py` staying green after the format pass is what proves
# the changes made were the non-behavioural kind they claimed to be.

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

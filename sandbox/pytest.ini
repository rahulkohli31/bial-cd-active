# Sandbox-scoped pytest config.
#
# This file exists ONLY to give the sandbox test harness its OWN pytest rootdir = `sandbox/`.
# The harness is run under the backend interpreter + deps:
#
#     cd sandbox && uv run --project ../backend pytest            # offline lane (default)
#     cd sandbox && uv run --project ../backend pytest -m integration   # Docker lane
#
# `uv run --project ../backend` supplies the interpreter and deps (httpx, fastapi, pytest);
# pytest INDEPENDENTLY discovers THIS file as its config, so backend's own `pyproject.toml`
# (rooted at `backend/`, `testpaths=["tests"]`, and whose `tests/conftest.py` HARD-REQUIRES a
# live Postgres) is never the rootdir and never collected.
#
# WHY `pytest.ini` AND NOT `pyproject.toml`. A `pyproject.toml` carrying no `[project]` table is
# read by uv as an implicit VIRTUAL WORKSPACE ROOT (astral-sh/uv#4541), so any bare `uv` call in
# sandbox/ — one that forgets `--project ../backend` — drops a `.venv` and an empty `uv.lock`
# here. `sandbox/` is not an installable package anyway. `pytest.ini` is invisible to uv's
# project discovery, and pytest ranks it ABOVE `pyproject.toml`: it always matches, even when
# empty.

[pytest]
asyncio_mode = auto
# The offline supervisor suite (`supervisor/test_app.py`, non-spawning) + the harness (`tests/`).
# BOTH paths are load-bearing: drop `supervisor` and its suite silently stops being collected.
testpaths =
    tests
    supervisor
# --strict-markers turns a typo'd marker into an error rather than a silent skip.
markers =
    integration: opt-in; needs Docker (the in-container guards and framing)
# Default lane runs offline only; the Docker lane is opt-in via `-m integration`, so `pytest`
# without Docker gives a clean skip, not a hang.
addopts = -m 'not integration' --strict-markers
